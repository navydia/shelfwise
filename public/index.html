<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Shelfwise</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Shelfwise">
  <meta name="theme-color" content="#F2EEE6">
  <link rel="preload" href="/fonts/figtree-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/figtree-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/bricolage-800.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="top">
    <div id="wordmark"></div>
    <button id="store-btn" class="store-pill" type="button" aria-label="Store" hidden></button>
  </header>
  <div id="offline" class="offline" hidden>Offline: showing saved data</div>
  <a id="back-link" class="back-link" href="#/pantry" hidden><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 6l-6 6 6 6"/></svg>Pantry</a>
  <main id="view"></main>
  <div class="dock" hidden>
    <nav class="tabs glass" id="tabs" aria-label="Sections"></nav>
    <div id="dock-action"></div>
    <a id="fab" class="fab" href="#/receipt" aria-label="Scan a receipt" hidden></a>
  </div>
  <script type="module">
    import { wordmarkHtml } from '/ui/wordmark.js';
    document.getElementById('wordmark').innerHTML = wordmarkHtml(24);
  </script>
  <script type="module" src="/app.js"></script>
</body>
</html>
